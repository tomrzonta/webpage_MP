<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal de Planilhas - Setores</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .user-info { text-align: right; margin-bottom: 20px; font-size: 0.9em; color: #555; }
        h1 { text-align: center; }
        .grid-buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 30px; }
        .btn { display: block; padding: 20px; text-decoration: none; background-color: #007bff; color: white; border-radius: 4px; transition: background-color 0.2s; text-align: center; font-size: 1.1em; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-info">
            Olá, {{ current_user.email }}! <a href="{{ url_for('logout') }}">Sair</a>
        </div>
        <h1>Selecione um Setor</h1>
        <div class="grid-buttons">
            {% for sector in sectors %}
                <a href="{{ url_for('view_sector', sector_name=sector) }}" class="btn">{{ sector }}</a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
