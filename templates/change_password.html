<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    
    <style>
        :root { --bg-color: #f4f4f9; --header-bg: #ffffff; --card-bg: #ffffff; --text-color: #333; --border-color: #dee2e6; }
        body.dark-mode { --bg-color: #121212; --header-bg: #1e1e1e; --card-bg: #1e1e1e; --text-color: #e0e0e0; --border-color: #333333; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; transition: background-color 0.2s, color 0.2s; }
        .card { background-color: var(--card-bg); border-color: var(--border-color); }
        .dark-mode .form-control { background-color: #333; color: #e0e0e0; border-color: #555; }
        .dark-mode .form-label, .dark-mode h2 { color: #e8e8e8 !important; }
        .header { background-color: var(--header-bg); padding: 0 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; height: 60px; margin-bottom: 2rem; }
        .admin-button { background-color: #6c757d; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <div>
            <a href="{{ url_for('dashboard') }}" class="admin-button">Voltar ao Dashboard</a>
        </div>
        <div>
            <a href="#" id="darkModeToggleUser" class="admin-button" title="Alternar Modo Escuro"><i class="fa fa-moon-o"></i></a>
        </div>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="text-center">Alterar Minha Senha</h2>
                    <hr>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endwith %}
                    <form method="POST" action="{{ url_for('change_password') }}">
                        <div class="mb-3">
                            <label for="new_password" class="form-label">Nova Senha</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirmar Nova Senha</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar Nova Senha</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Voltar</a>
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButtonUser = document.getElementById('darkModeToggleUser');
            const body = document.body;
            const enableDarkMode = () => { body.classList.add('dark-mode'); localStorage.setItem('darkModeUser', 'enabled'); toggleButtonUser.innerHTML = '<i class="fa fa-sun-o"></i>'; };
            const disableDarkMode = () => { body.classList.remove('dark-mode'); localStorage.setItem('darkModeUser', 'disabled'); toggleButtonUser.innerHTML = '<i class="fa fa-moon-o"></i>'; };
            if (localStorage.getItem('darkModeUser') === 'enabled') { enableDarkMode(); }
            if(toggleButtonUser) {
                toggleButtonUser.addEventListener('click', (e) => { e.preventDefault(); if (localStorage.getItem('darkModeUser') === 'enabled') { disableDarkMode(); } else { enableDarkMode(); } });
            }
        });
    </script>
</body>
</html>
