<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("{{ url_for('static', filename='background_login.png') }}");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            overflow: hidden;
            
            /* --- ALTERAÇÃO PRINCIPAL: Usando Flexbox --- */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cursor-effect {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            z-index: 1;
            backdrop-filter: blur(5px) contrast(1.2);
            -webkit-backdrop-filter: blur(5px) contrast(1.2);
        }

        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 2;
        }
        
        .app-title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .app-title h1 {
            font-size: 4rem;
            font-weight: bold;
            margin: 0;
        }
        .app-title p {
            font-size: 1.5rem;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .app-title .mp-logo {
            background-color: #ff8c00;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8em;
        }

        .login-container {
            padding: 40px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            min-width: 350px;
            color: white;
        }
        
        .login-container h2 { text-align: center; margin-bottom: 20px; font-weight: 300; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: white; font-size: 1em; }
        button { width: 100%; padding: 12px; border: none; background-color: #007bff; color: white; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        .alert { padding: 15px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px; margin-bottom: 20px; text-align: center; }

    </style>
</head>
<body>
    <div class="cursor-effect"></div>

    <div class="page-container">
        
        <div class="app-title">
            <h1>CoDiLink</h1>
            <p>Multipedidos <span class="mp-logo">MP</span></p>
        </div>

        <div class="login-container">
            <h2>Login</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

    </div>

    <script>
        document.addEventListener('mousemove', function(e) {
            const cursorEffect = document.querySelector('.cursor-effect');
            cursorEffect.style.left = e.clientX + 'px';
            cursorEffect.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
