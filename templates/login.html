<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - CoDiLink</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: url("{{ url_for('static', filename='background_login.jpeg') }}");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        
        .app-title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .app-title h1 {
            font-size: clamp(3rem, 12vw, 4.5rem);
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }
        .app-title p {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        /* Estilo para o seu logo */
        .app-title .mp-logo-img {
            width: 32px;
            height: 32px;
        }

        .login-container {
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
            border-radius: 10px;
            background: rgba(10, 10, 10, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            color: white;
        }
        
        .login-container h2 { text-align: center; margin-bottom: 25px; font-weight: 300; font-size: 1.8rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: white; font-size: 1em; }
        button { width: 100%; padding: 12px; border: none; background-color: #0d6efd; color: white; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #0b5ed7; }
        .alert { padding: 15px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px; margin-bottom: 20px; text-align: center; }

    </style>
</head>
<body>
    
    <div class="page-container">
        
        <div class="app-title">
            <h1>CoDiLink</h1>
            <p>Multipedidos <img src="{{ url_for('static', filename='logo_mp.png') }}" alt="Logo MP" class="mp-logo-img"></p>
        </div>

        <div class="login-container">
            <h2>Login</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

    </div>

</body>
</html>
