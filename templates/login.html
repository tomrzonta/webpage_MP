<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("{{ url_for('static', filename='background_login.png') }}");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            overflow: hidden; /* Garante que não apareçam barras de rolagem indesejadas */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 2;
            /* Adiciona um padding vertical para garantir espaço para o conteúdo */
            padding: 20px 0; 
            box-sizing: border-box; /* Garante que o padding não aumente a altura total */
        }
        
        .app-title {
            text-align: center;
            color: white;
            /* Margem inferior ajustada para economizar espaço */
            margin-bottom: 25px; /* Era 40px, agora 25px */
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            /* Garante que o título não fique muito largo em telas pequenas */
            max-width: 90%; 
        }
        .app-title h1 {
            /* Tamanho da fonte responsivo */
            font-size: 3.5rem; /* Era 4rem, agora 3.5rem como padrão */
            font-weight: bold;
            margin: 0;
        }
        .app-title p {
            /* Tamanho da fonte responsivo */
            font-size: 1.3rem; /* Era 1.5rem, agora 1.3rem como padrão */
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .app-title .mp-logo {
            background-color: #ff8c00;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8em;
        }

        /* --- MEDIA QUERIES para Responsividade --- */
        @media (max-width: 768px) {
            .app-title h1 {
                font-size: 2.5rem; /* Fonte menor em telas menores */
            }
            .app-title p {
                font-size: 1rem; /* Fonte menor em telas menores */
            }
            .app-title .mp-logo {
                width: 25px;
                height: 25px;
                font-size: 0.7em;
            }
            .login-container {
                min-width: unset; /* Remove min-width em telas pequenas */
                width: 90%; /* Ajusta a largura do container de login */
                padding: 30px; /* Reduz o padding */
            }
        }

        @media (max-height: 700px) { /* Para alturas de tela menores (notebooks pequenos, por exemplo) */
             .app-title {
                margin-bottom: 15px; /* Reduz a margem inferior do título */
            }
            .login-container {
                padding: 30px; /* Reduz o padding do container de login */
            }
        }
        /* --- FIM DAS MEDIA QUERIES --- */


        .login-container {
            padding: 40px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            min-width: 350px;
            color: white;
            box-sizing: border-box; /* Garante que padding não aumente a largura total */
        }
        
        .login-container h2 { text-align: center; margin-bottom: 20px; font-weight: 300; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 5px; border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.1); color: white; font-size: 1em; }
        button { width: 100%; padding: 12px; border: none; background-color: #007bff; color: white; border-radius: 5px; cursor: pointer; font-size: 1.1em; font-weight: bold; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        .alert { padding: 15px; background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; border-radius: 5px; margin-bottom: 20px; text-align: center; }

    </style>
</head>
<body>
    
    <div class="page-container">
        
        <div class="app-title">
            <h1>CoDiLink</h1>
            <p>Multipedidos <span class="mp-logo">MP</span></p>
        </div>

        <div class="login-container">
            <h2>Login</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
        </div>

    </div>

</body>
</html>
