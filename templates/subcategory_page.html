<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ subcategory_name }}</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .user-info { text-align: right; margin-bottom: 20px; font-size: 0.9em; color: #555; }
        h1 { text-align: center; }
        .back-link { display: block; margin-top: 40px; text-align: center; }

        /* Estilos para o Menu Suspenso (Dropdown) */
        .dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-top: 30px;
        }

        .dropdown-button {
            background-color: #007bff;
            color: white;
            padding: 20px;
            font-size: 1.1em;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 100%;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 4px;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            border-bottom: 1px solid #f1f1f1;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropdown-button {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-info">
            Olá, {{ current_user.email }}! <a href="{{ url_for('logout') }}">Sair</a>
        </div>

        <h1>{{ subcategory_name }}</h1>
        <p style="text-align: center;">Passe o mouse sobre o botão abaixo para ver os links.</p>

        <div class="dropdown">
            <button class="dropdown-button">Abrir Links de {{ subcategory_name }}</button>
            <div class="dropdown-content">
                {% for key, dados in planilhas.items() %}
                    <a href="{{ dados.url }}" target="_blank">{{ dados.nome }}</a>
                {% endfor %}
            </div>
        </div>

        <a href="{{ url_for('view_sector', sector_name=sector_name) }}" class="back-link">Voltar para {{ sector_name }}</a>
    </div>
</body>
</html>
