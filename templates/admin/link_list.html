{% extends 'admin/model/list.html' %}

{% block body %}
    {{ super() }} {# Renderiza a tabela padrão do Admin #}

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tableBody = document.querySelector('.table tbody');
            
            if (tableBody) {
                new Sortable(tableBody, {
                    animation: 150,
                    handle: '.drag-handle', // Usamos nossa "alça" para arrastar

                    onEnd: function (evt) {
                        const allRows = tableBody.querySelectorAll('tr');
                        // Pegamos o ID de cada linha diretamente do atributo 'data-id' na nossa alça
                        const orderedIds = Array.from(allRows).map(row => row.querySelector('.drag-handle').dataset.id);
                        
                        fetch('{{ url_for("reorder_links") }}', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ordered_ids: orderedIds }),
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                // Opcional: notificar o usuário do sucesso
                                console.log(data.message);
                            } else {
                                alert('ERRO ao salvar a ordem: ' + data.message);
                            }
                        })
                        .catch((error) => {
                            alert('ERRO de rede ao salvar a ordem.');
                        });
                    }
                });
            }
        });
    </script>
{% endblock %}
